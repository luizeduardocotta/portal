<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora JP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        .cart-drawer {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }

        .cart-drawer.open {
            transform: translateX(0);
        }

        .overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .product-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        .badge-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .8;
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .badge-esgotado {
            background: #dc3545;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-disponivel {
            background: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-gray-50">



    <script>
        // ============================================
        // 🔧 ÁREA DE CONFIGURAÇÃO - EDITE AQUI
        // ============================================

        const CONFIG = {
            nomeLoja: "Distribuidora JP",
            logo: "img/logo.webp",
            valorFrete: 15.00,
            chavePix: "SEU_CPF_OU_CHAVE_PIX_AQUI", // Adicione esta linha
            adminEmail: "adm-distribuidorajp@hotmail.com" // Email do administrador
        };

        // CONFIGURAÇÃO SUPABASE - SUBSTITUA COM SUAS CREDENCIAIS
        const SUPABASE_URL = 'https://rvpidntrgfuusqroqgxy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tR5jcVGmTG7Fi4mZwtjrvg_RAvomdLY';

        // MERCADO PAGO - SUBSTITUA COM SEU ACCESS TOKEN
        const MERCADO_PAGO_ACCESS_TOKEN = 'SEU_ACCESS_TOKEN_MERCADO_PAGO_AQUI';
        const WEBHOOK_URL = 'SUA_URL_WEBHOOK_AQUI'; // URL da sua função serverless

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        // ============================================
        // 💾 ESTADO DA APLICAÇÃO
        // ============================================

        let state = {
            carrinho: [],
            categoriaAtiva: 'Todos',
            buscaTexto: '',
            carrinhoAberto: false,
            usuarioAtual: null,
            produtos: [],
            modoAuth: 'login' // 'login' ou 'cadastro'
        };

        // ============================================
        // 🛠️ FUNÇÕES AUXILIARES
        // ============================================

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function obterCategorias() {
            const cats = [...new Set(state.produtos.map(p => p.categoria))];
            return ['Todos', ...cats];
        }

        function filtrarProdutos() {
            return state.produtos.filter(produto => {
                const matchCategoria = state.categoriaAtiva === 'Todos' || produto.categoria === state.categoriaAtiva;
                const matchBusca = produto.nome.toLowerCase().includes(state.buscaTexto.toLowerCase()) ||
                    (produto.descricao && produto.descricao.toLowerCase().includes(state.buscaTexto.toLowerCase()));
                return matchCategoria && matchBusca;
            });
        }

        function calcularSubtotal() {
            return state.carrinho.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
        }

        function calcularTotal(incluirFrete) {
            const subtotal = calcularSubtotal();
            return incluirFrete ? subtotal + CONFIG.valorFrete : subtotal;
        }

        function mostrarNotificacao(mensagem, tipo = 'success') {
            const notif = document.getElementById('notificacao');
            notif.textContent = mensagem;
            notif.classList.remove('hidden', 'bg-black', 'bg-red-500', 'bg-green-500');

            if (tipo === 'error') {
                notif.classList.add('bg-red-500');
            } else if (tipo === 'success') {
                notif.classList.add('bg-green-500');
            } else {
                notif.classList.add('bg-black');
            }

            notif.classList.add('animate-bounce');

            setTimeout(() => {
                notif.classList.add('hidden');
                notif.classList.remove('animate-bounce');
            }, 3000);
        }

        function abrirModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function fecharModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // ============================================
        // 🔐 AUTENTICAÇÃO
        // ============================================

        async function inicializarAuth() {
            // Carrega os produtos primeiro, independente de quem está logado
            carregarProdutos();

            const { data: { user }, error } = await supabaseClient.auth.getUser();

            if (user) {
                // Se houver usuário, tenta carregar o perfil em segundo plano
                await carregarUsuario(user);
            } else {
                // Se não houver, apenas garante que a interface está no modo visitante
                atualizarInterfaceUsuario();
            }
        }

        async function carregarUsuario(user) {
            // TROCA AQUI: de supabase para supabaseClient
            const { data: perfil } = await supabaseClient
                .from('perfis')
                .select('*')
                .eq('id', user.id)
                .single();

            // Aqui unimos os dados de login com os dados do perfil (nome/whatsapp)
            state.usuarioAtual = { ...user, ...perfil };
            atualizarInterfaceUsuario();
        }

        function atualizarInterfaceUsuario() {
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');
            const userDisplay = document.getElementById('user-display');
            const adminPanel = document.getElementById('admin-panel');
            const lojaView = document.getElementById('loja-view');

            if (state.usuarioAtual) {
                // Pega o primeiro nome e o whatsapp do estado
                const primeiroNome = (state.usuarioAtual.nome || 'Usuário').split(' ')[0];
                const telefone = state.usuarioAtual.whatsapp || 'Sem número';
                const telefoneFormatado = formatarTelefone(state.usuarioAtual.whatsapp);

                // HTML padronizado: Nome em destaque e telefone pequeno abaixo
                userDisplay.innerHTML = `
               <div class="flex flex-col items-end mr-3 leading-tight">
                <span class="text-sm font-bold text-gray-900">${primeiroNome}</span>
                <span class="text-[10px] text-green-600 font-medium">${telefoneFormatado}</span>
               </div>
               `;

                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');

                // Lógica do Painel Admin
                if (state.usuarioAtual.is_admin) {
                    adminPanel.classList.add('active');
                    lojaView.classList.add('hidden');
                    carregarPedidosAdmin();
                    carregarProdutosAdmin();
                } else {
                    adminPanel.classList.remove('active');
                    lojaView.classList.remove('hidden');
                }
            } else {
                // Caso não esteja logado
                userDisplay.innerHTML = '<span class="text-sm font-medium text-gray-400">Visitante</span>';
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                adminPanel.classList.remove('active');
                lojaView.classList.remove('hidden');
            }
        }
        function toggleAuthMode() {
            state.modoAuth = state.modoAuth === 'login' ? 'cadastro' : 'login';
            const isLogin = state.modoAuth === 'login';

            document.getElementById('auth-title').textContent = isLogin ? 'Login' : 'Criar Conta';
            document.getElementById('cadastro-fields').style.display = isLogin ? 'none' : 'block';
            document.getElementById('btn-auth-submit').textContent = isLogin ? 'Entrar' : 'Cadastrar';
            document.getElementById('btn-toggle-auth').textContent = isLogin ? 'Criar Conta' : 'Já tenho conta';
        }

        async function submitAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const senha = document.getElementById('auth-senha').value;

            if (!email || !senha) {
                mostrarNotificacao('Preencha email e senha', 'error');
                return;
            }

            try {
                if (state.modoAuth === 'login') {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email,
                        password: senha
                    });
                    if (error) throw error;
                    await carregarUsuario(data.user);
                    mostrarNotificacao('Login realizado com sucesso!', 'success');
                } else {
                    const nome = document.getElementById('auth-nome').value;
                    // Localize onde você pega o valor do whatsapp e adicione o .replace
                    const whatsappRaw = document.getElementById('auth-whatsapp').value;
                    const whatsapp = whatsappRaw.replace(/\D/g, ''); // Salva só números no banco: 31999999999

                    if (!nome || !whatsapp) {
                        mostrarNotificacao('Preencha todos os campos', 'error');
                        return;
                    }

                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password: senha
                    });
                    if (error) throw error;

                    const isAdmin = email === CONFIG.adminEmail;
                    await supabaseClient.from('perfis').insert({
                        id: data.user.id,
                        nome,
                        whatsapp,
                        is_admin: isAdmin
                    });

                    await carregarUsuario(data.user);
                    mostrarNotificacao('Cadastro realizado com sucesso!', 'success');
                }

                fecharModal('modal-auth');
                limparFormAuth();
            } catch (error) {
                mostrarNotificacao('Erro: ' + error.message, 'error');
            }
        }

        // Adicione este listener para formatar enquanto o usuário digita
        document.addEventListener('input', function (e) {
            if (e.target.id === 'auth-whatsapp') {
                let v = e.target.value.replace(/\D/g, ''); // Remove tudo que não é dígito

                if (v.length > 11) v = v.slice(0, 11); // Limita a 11 números

                if (v.length > 10) {
                    // Formato (99) 99999-9999
                    v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3");
                } else if (v.length > 6) {
                    // Formato (99) 9999-9999
                    v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3");
                } else if (v.length > 2) {
                    // Formato (99) 9
                    v = v.replace(/^(\d{2})(\d{0,5}).*/, "($1) $2");
                } else if (v.length > 0) {
                    // Formato (99
                    v = v.replace(/^(\d*)/, "($1");
                }
                e.target.value = v;
            }
        });

        function formatarTelefone(v) {
            if (!v) return 'Sem número';
            // Remove qualquer coisa que não seja número
            let n = v.replace(/\D/g, "");

            // Se tiver 11 dígitos (celular com 9)
            if (n.length === 11) {
                return n.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
            }
            // Se tiver 10 dígitos (fixo)
            if (n.length === 10) {
                return n.replace(/^(\d{2})(\d{4})(\d{4})$/, "($1) $2-$3");
            }
            return v; // Retorna o original se não encaixar nos padrões
        }
        function limparFormAuth() {
            document.getElementById('auth-email').value = '';
            document.getElementById('auth-senha').value = '';
            document.getElementById('auth-nome').value = '';
            document.getElementById('auth-whatsapp').value = '';
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            state.usuarioAtual = null;
            state.carrinho = [];
            atualizarInterfaceUsuario();
            renderizar();
            mostrarNotificacao('Logout realizado com sucesso!', 'success');
        }

        // ============================================
        // 🛍️ PRODUTOS
        // ============================================

        async function carregarProdutos() {
            try {
                const { data: produtos, error } = await supabaseClient
                    .from('produtos')
                    .select('*')
                    .order('nome');

                if (error) throw error;

                state.produtos = produtos || [];

                // ATENÇÃO: Verifique se este nome abaixo está igual à sua função de desenho
                renderizarProdutos();

            } catch (error) {
                console.error('Erro ao carregar produtos:', error.message);
            }
        }

        function adicionarAoCarrinho(produtoId) {
            if (!state.usuarioAtual) {
                mostrarNotificacao('Você precisa estar logado para adicionar produtos!', 'error');
                abrirModal('modal-auth');
                return;
            }

            const produto = state.produtos.find(p => p.id === produtoId);

            if (!produto) return;

            if (produto.estoque <= 0) {
                mostrarNotificacao('Produto esgotado!', 'error');
                return;
            }

            const itemExistente = state.carrinho.find(item => item.id === produtoId);

            if (itemExistente) {
                if (itemExistente.quantidade >= produto.estoque) {
                    mostrarNotificacao('Estoque insuficiente!', 'error');
                    return;
                }
                itemExistente.quantidade++;
            } else {
                state.carrinho.push({ ...produto, quantidade: 1 });
            }

            renderizar();
            mostrarNotificacao('Produto adicionado ao carrinho!', 'success');
        }

        function removerDoCarrinho(produtoId) {
            state.carrinho = state.carrinho.filter(item => item.id !== produtoId);
            renderizar();
        }

        function alterarQuantidade(produtoId, delta) {
            const item = state.carrinho.find(i => i.id === produtoId);
            const produto = state.produtos.find(p => p.id === produtoId);

            if (item && produto) {
                const novaQuantidade = item.quantidade + delta;

                if (novaQuantidade <= 0) {
                    removerDoCarrinho(produtoId);
                } else if (novaQuantidade > produto.estoque) {
                    mostrarNotificacao('Estoque insuficiente!', 'error');
                } else {
                    item.quantidade = novaQuantidade;
                    renderizar();
                }
            }
        }

        function toggleCarrinho() {
            if (!state.usuarioAtual && !state.carrinhoAberto) {
                mostrarNotificacao('Faça login para acessar o carrinho!', 'error');
                abrirModal('modal-auth');
                return;
            }
            state.carrinhoAberto = !state.carrinhoAberto;
            renderizar();
        }

        // ============================================
        // 💳 CHECKOUT
        // ============================================

        async function finalizarPedido(event) {
            event.preventDefault();

            if (state.carrinho.length === 0) {
                mostrarNotificacao('Seu carrinho está vazio!', 'error');
                return;
            }

            const formData = new FormData(event.target);
            const endereco = formData.get('endereco');
            const tipoEntrega = formData.get('tipoEntrega');

            const incluirFrete = tipoEntrega === 'entrega';
            const total = calcularTotal(incluirFrete);

            try {
                // Criar pedido no Supabase
                const { data: pedido, error } = await supabase
                    .from('pedidos')
                    .insert({
                        cliente_id: state.usuarioAtual.id,
                        total: total,
                        status: 'Pendente',
                        endereco: endereco,
                        tipo_entrega: tipoEntrega
                    })
                    .select()
                    .single();

                if (error) throw error;

                // Salvar itens do pedido
                const itensPedido = state.carrinho.map(item => ({
                    pedido_id: pedido.id,
                    produto_id: item.id,
                    quantidade: item.quantidade,
                    preco_unitario: item.preco
                }));

                await supabaseClient.from('itens_pedido').insert(itensPedido);

                // Criar preferência no Mercado Pago
                const preference = await criarPreferenciaMercadoPago(pedido.id, total);

                // Atualizar pedido com link de pagamento
                await supabase
                    .from('pedidos')
                    .update({ link_pagamento: preference.init_point })
                    .eq('id', pedido.id);

                // Redirecionar para pagamento
                window.open(preference.init_point, '_blank');

                state.carrinho = [];
                state.carrinhoAberto = false;
                renderizar();
                mostrarNotificacao('Pedido criado! Você será redirecionado para o pagamento.', 'success');
            } catch (error) {
                console.error('Erro ao finalizar compra:', error);
                mostrarNotificacao('Erro ao finalizar compra: ' + error.message, 'error');
            }
        }

        async function criarPreferenciaMercadoPago(pedidoId, total) {
            const items = state.carrinho.map(item => ({
                title: item.nome,
                quantity: item.quantidade,
                unit_price: parseFloat(item.preco),
                currency_id: 'BRL'
            }));

            const response = await fetch('https://api.mercadopago.com/checkout/preferences', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${MERCADO_PAGO_ACCESS_TOKEN}`
                },
                body: JSON.stringify({
                    items: items,
                    external_reference: pedidoId.toString(),
                    notification_url: WEBHOOK_URL,
                    back_urls: {
                        success: window.location.href,
                        failure: window.location.href,
                        pending: window.location.href
                    },
                    auto_return: 'approved'
                })
            });

            return await response.json();
        }

        function selecionarPagamento(metodo) {
            state.metodoPagamento = metodo;

            // Remove o destaque de todos
            document.querySelectorAll('.pay-btn').forEach(btn => {
                btn.classList.remove('border-green-600', 'bg-green-50', 'text-green-600', 'ring-2', 'ring-green-600');
            });

            // Adiciona destaque ao selecionado
            const btnAtivo = document.getElementById(`pay-${metodo}`);
            if (btnAtivo) {
                btnAtivo.classList.add('border-green-600', 'bg-green-50', 'text-green-600', 'ring-2', 'ring-green-600');
            }

            // Mostra/Esconde a chave PIX
            const pixInfo = document.getElementById('pix-info');
            if (pixInfo) {
                metodo === 'PIX' ? pixInfo.classList.remove('hidden') : pixInfo.classList.add('hidden');
            }
        }

        // ============================================
        // 👨‍💼 PAINEL ADMIN
        // ============================================

        async function carregarPedidosAdmin() {
            const { data: pedidos } = await supabase
                .from('pedidos')
                .select(`
                    *,
                    perfis (nome, whatsapp)
                `)
                .order('data', { ascending: false });

            const container = document.getElementById('admin-pedidos-list');

            if (!pedidos || pedidos.length === 0) {
                container.innerHTML = '<p class="text-center py-8 text-gray-500">Nenhum pedido encontrado</p>';
                return;
            }

            container.innerHTML = `
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cliente</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">WhatsApp</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Total</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Data</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${pedidos.map(p => `
                                <tr>
                                    <td class="px-4 py-4 text-sm">#${p.id}</td>
                                    <td class="px-4 py-4 text-sm">${p.perfis.nome}</td>
                                    <td class="px-4 py-4 text-sm">
                                        <a href="https://wa.me/55${p.perfis.whatsapp.replace(/\D/g, '')}" 
                                           target="_blank" 
                                           class="text-green-600 hover:text-green-800">
                                            ${p.perfis.whatsapp}
                                        </a>
                                    </td>
                                    <td class="px-4 py-4 text-sm font-medium">${formatarMoeda(p.total)}</td>
                                    <td class="px-4 py-4 text-sm">
                                        <span class="px-3 py-1 rounded-full text-xs font-medium ${getStatusColor(p.status)}">
                                            ${p.status}
                                        </span>
                                    </td>
                                    <td class="px-4 py-4 text-sm">${new Date(p.data).toLocaleString('pt-BR')}</td>
                                    <td class="px-4 py-4 text-sm">
                                        <select onchange="atualizarStatusPedido(${p.id}, this.value)" 
                                                class="px-3 py-1 border border-gray-300 rounded-lg text-sm">
                                            <option value="">Alterar...</option>
                                            <option value="Pago">Pago</option>
                                            <option value="Enviado">Enviado</option>
                                            <option value="Entregue">Entregue</option>
                                        </select>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function getStatusColor(status) {
            const colors = {
                'Pendente': 'bg-yellow-100 text-yellow-800',
                'Pago': 'bg-green-100 text-green-800',
                'Enviado': 'bg-blue-100 text-blue-800',
                'Entregue': 'bg-gray-100 text-gray-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }

        async function atualizarStatusPedido(pedidoId, novoStatus) {
            if (!novoStatus) return;

            try {
                await supabase
                    .from('pedidos')
                    .update({ status: novoStatus })
                    .eq('id', pedidoId);

                if (novoStatus === 'Pago') {
                    await darBaixaEstoque(pedidoId);
                }

                await carregarPedidosAdmin();
                mostrarNotificacao('Status atualizado com sucesso!', 'success');

        async function darBaixaEstoque(pedidoId) {
            const { data: itens } = await supabase
                .from('itens_pedido')
                .select('produto_id, quantidade')
                .eq('pedido_id', pedidoId);

            for (const item of itens) {
                const { data: produto } = await supabase
                    .from('produtos')
                    .select('estoque')
                    .eq('id', item.produto_id)
                    .single();

                const novoEstoque = produto.estoque - item.quantidade;

                await supabase
                    .from('produtos')
                    .update({ estoque: Math.max(0, novoEstoque) })
                    .eq('id', item.produto_id);
            }

            await carregarProdutos();
        }

        async function editarProduto(produtoId) {
            try {
                // Mudança para supabaseClient para evitar o erro de TypeError
                const { data: produto, error } = await supabaseClient
                    .from('produtos')
                    .select('*')
                    .eq('id', produtoId)
                    .single();

                if (error) throw error;

                // Preenchimento dos campos do modal
                document.getElementById('edit-produto-id').value = produto.id;
                document.getElementById('edit-nome').value = produto.nome;
                document.getElementById('edit-preco').value = produto.preco;
                document.getElementById('edit-descricao').value = produto.descricao || '';
                document.getElementById('edit-categoria').value = produto.categoria || '';
                document.getElementById('edit-imagem').value = produto.caminho_imagem_local || '';
                document.getElementById('edit-estoque').value = produto.estoque;

                document.getElementById('modal-produto-title').textContent = 'Editar Produto';
                abrirModal('modal-edit-produto');
            } catch (error) {

        async function salvarProduto(event) {
            if (event) event.preventDefault();

            const id = document.getElementById('edit-produto-id').value;
            const fileInput = document.getElementById('edit-arquivo');
            const file = fileInput.files[0];
            // Mantém a imagem atual caso o admin não selecione uma nova
            let urlImagem = document.getElementById('edit-imagem').value;

            try {
                // 1. Se um novo arquivo foi selecionado, faz o upload para o Storage
                if (file) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
                    const filePath = fileName;

                    // Faz o upload para o bucket 'produtos' (certifique-se de ter criado ele no Supabase)
                    const { error: uploadError } = await supabaseClient.storage
                        .from('produtos')
                        .upload(filePath, file);

                    if (uploadError) throw uploadError;

                    // Pega a URL pública da imagem recém-enviada
                    const { data: { publicUrl } } = supabaseClient.storage
                        .from('produtos')
                        .getPublicUrl(filePath);

                    urlImagem = publicUrl;
                }

                // 2. Prepara os dados para salvar na tabela 'produtos'
                const produtoData = {
                    nome: document.getElementById('edit-nome').value,
                    preco: parseFloat(document.getElementById('edit-preco').value),
                    descricao: document.getElementById('edit-descricao').value,
                    categoria: document.getElementById('edit-categoria').value,
                    caminho_imagem_local: urlImagem, // Agora salva a URL do Storage
                    estoque: parseInt(document.getElementById('edit-estoque').value)
                };

                let result;
                if (id) {
                    result = await supabaseClient.from('produtos').update(produtoData).eq('id', id);
                } else {
                    result = await supabaseClient.from('produtos').insert([produtoData]);
                }

                if (result.error) throw result.error;
 
                mostrarNotificacao('Produto salvo com sucesso!', 'success');
                fecharModal('modal-edit-produto');
                // Limpa o campo de arquivo para o próximo uso
                fileInput.value = '';
                carregarProdutos();
            } catch (error) {
                console.error('Erro ao salvar:', error);
                mostrarNotificacao('Erro ao salvar: ' + error.message, 'error');
            }
        }

        async function excluirProduto(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) return;

            try {
                const { error } = await supabaseClient
                    .from('produtos')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                alert('Produto excluído!');
                carregarProdutos();
            } catch (error) {
                alert('Erro ao excluir produto: ' + error.message);
            }
        }

                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img id="logo-loja" src="img/logo.webp" class="h-24 w-auto" alt="Logo da loja">
                        <span class="text-2xl font-bold text-black" id="nome-loja"></span>
                    </div>

                    <div class="flex items-center gap-4">
                        <span id="user-display" class="text-sm text-gray-600"></span>
                        <button id="btn-login" onclick="abrirModal('modal-auth')"
                            class="px-4 py-2 bg-black text-white rounded-full text-sm font-medium hover:bg-gray-800 transition-colors">
                            Entrar
                        </button>
                        <button id="btn-logout" onclick="logout()"
                            class="hidden px-4 py-2 bg-gray-200 text-gray-700 rounded-full text-sm font-medium hover:bg-gray-300 transition-colors">
                            Sair
                        </button>
                        <button onclick="toggleCarrinho()"
                            class="relative p-2 hover:bg-gray-100 rounded-full transition-colors">
                            <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                            <span id="cart-badge"
                                class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center badge-pulse">
                                0
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Banner Promocional -->
        <section class="w-full bg-gradient-to-r from-black to-gray-800 text-white">
            <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="max-w-xl">
                    <span class="inline-block bg-green-500 text-black text-xs font-bold px-3 py-1 rounded-full mb-4">
                        OFERTA ESPECIAL
                    </span>
                    <h2 class="text-3xl md:text-4xl font-bold mb-4 leading-tight">
                        Até <span class="text-green-400">30% OFF</span> em produtos selecionados
                    </h2>
                    <p class="text-gray-300 mb-6">
                        Aproveite nossa promoção por tempo limitado. Qualidade premium com preço especial.
                    </p>
                    <button onclick="document.getElementById('produtos').scrollIntoView({ behavior: 'smooth' })"
                        class="bg-green-500 text-black px-6 py-3 rounded-full font-semibold hover:bg-green-400 transition">
                        Ver ofertas
                    </button>
                </div>
                <div class="w-full md:w-1/2">
                    <img src="img/banner.webp" alt="Banner Promocional"
                        class="w-full rounded-2xl shadow-xl object-cover"
                        onerror="this.src='https://via.placeholder.com/600x400?text=Banner'">
                </div>
            </div>
        </section>

        <!-- Busca -->
        <section class="bg-white">
            <div class="max-w-7xl mx-auto px-4 py-6">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                    <input type="text" placeholder="Buscar produtos..."
                        oninput="state.buscaTexto = this.value; renderizar();" class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-full
                           focus:ring-2 focus:ring-black focus:border-transparent
                           shadow-sm transition-all">
                </div>
            </div>
        </section>

        <!-- Categorias -->
        <div class="bg-white border-b border-gray-100 sticky top-[73px] z-30">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div id="categorias" class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide"></div>
            </div>
        </div>

        <!-- Produtos -->
        <main class="max-w-7xl mx-auto px-4 py-6">
            <div id="produtos" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </main>

        <!-- Overlay -->
        <div id="overlay" class="overlay fixed inset-0 bg-black bg-opacity-50 z-40" onclick="toggleCarrinho()"></div>

        <!-- Carrinho Drawer -->
        <div id="cart-drawer"
            class="cart-drawer fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl z-50 overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 p-4 flex items-center justify-between">
                <h2 class="text-xl font-bold">Meu Carrinho</h2>
                <button onclick="toggleCarrinho()" class="p-2 hover:bg-gray-100 rounded-full">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="p-4">
                <div id="cart-items" class="space-y-4 mb-6"></div>
                <div id="checkout-form"></div>
            </div>
        </div>
    </div>

    <!-- VIEW: ADMIN -->
    <div id="admin-panel" class="admin-section">
        <div class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-bold">Painel Administrativo</h1>
                    <button onclick="voltarParaLoja()"
                        class="px-4 py-2 bg-gray-200 text-gray-700 rounded-full text-sm font-medium hover:bg-gray-300 transition-colors">
                        Ver Loja
                    </button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 py-6">
            <!-- Tabs -->
            <div class="flex gap-2 mb-6">
                <button id="admin-tab-pedidos" onclick="switchAdminTab('pedidos')"
                    class="px-6 py-3 rounded-lg font-medium transition-all bg-black text-white">
                    Pedidos
                </button>
                <button id="admin-tab-produtos" onclick="switchAdminTab('produtos')"
                    class="px-6 py-3 rounded-lg font-medium transition-all bg-white text-gray-700 hover:bg-gray-100">
                    Produtos
                </button>
            </div>

            <!-- Seção Pedidos -->
            <div id="admin-sec-pedidos" class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-xl font-bold mb-4">Gestão de Pedidos</h2>
                <div id="admin-pedidos-list"></div>
            </div>

            <!-- Seção Produtos -->
            <div id="admin-sec-produtos" class="hidden bg-white rounded-2xl shadow-sm p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold">Gestão de Produtos</h2>
                    <button onclick="novoProduto()"
                        class="px-4 py-2 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 transition-colors">
                        + Novo Produto
                    </button>
                </div>
                <div id="admin-produtos-list"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('logo-loja').src = CONFIG.logo;
        document.getElementById('nome-loja').textContent = CONFIG.nomeLoja;
    </script>
</body>

</html>
