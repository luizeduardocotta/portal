<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Portal Lagoa Santa</title>
    <link rel="icon" href="img/favicon.webp" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        
        .status-pendente { background: #FEF3C7; color: #92400E; }
        .status-pago { background: #D1FAE5; color: #065F46; }
        .status-enviado { background: #DBEAFE; color: #1E40AF; }
        .status-entregue { background: #E0E7FF; color: #3730A3; }
        .status-cancelado { background: #FEE2E2; color: #991B1B; }
        .status-reembolsado { background: #F3F4F6; color: #374151; }
        
        .card-pedido {
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .card-pedido:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .badge-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.5rem;
            height: 1.5rem;
            padding: 0 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
    </style>
</head>
<body class="bg-gray-50">

<!-- Tela de Carregamento -->
<div id="loading-screen">
    <div class="text-center">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600 mx-auto"></div>
        <p class="text-gray-600 mt-4 text-lg">Verificando permissões...</p>
    </div>
</div>

<!-- Conteúdo Principal (Oculto até verificar admin) -->
<div id="admin-content" class="hidden">

<!-- HEADER -->
<header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">📊 Painel Administrativo</h1>
                <p class="text-sm text-gray-500 mt-1" id="nome-loja">Carregando...</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="atualizarDados()" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Atualizar
                </button>
                
                <button onclick="exportarRelatorio()" 
                        class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Exportar
                </button>

                <a href="/" 
                   class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors">
                    Ver Loja
                </a>
            </div>
        </div>
    </div>
</header>

<!-- DASHBOARD CARDS -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Total de Pedidos</p>
                    <p class="text-3xl font-bold text-gray-900 mt-2" id="stat-total">0</p>
                </div>
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Faturamento</p>
                    <p class="text-3xl font-bold text-green-600 mt-2" id="stat-faturamento">R$ 0,00</p>
                </div>
                <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Aguardando Pagamento</p>
                    <p class="text-3xl font-bold text-yellow-600 mt-2" id="stat-pendentes">0</p>
                </div>
                <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                    <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Para Enviar</p>
                    <p class="text-3xl font-bold text-blue-600 mt-2" id="stat-enviar">0</p>
                </div>
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- TABS DE FILTRO -->
    <div class="bg-white rounded-xl shadow-sm mb-6">
        <div class="border-b border-gray-200">
            <nav class="flex -mb-px" id="tabs-container">
                <button onclick="filtrarPorStatus('todos')" 
                        class="tab-button flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm transition-colors border-blue-500 text-blue-600"
                        data-status="todos">
                    Todos <span class="badge-count ml-2 bg-blue-100 text-blue-600" id="count-todos">0</span>
                </button>
                <button onclick="filtrarPorStatus('Pendente')" 
                        class="tab-button flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm transition-colors border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300"
                        data-status="Pendente">
                    Pendentes <span class="badge-count ml-2 bg-gray-100 text-gray-600" id="count-Pendente">0</span>
                </button>
                <button onclick="filtrarPorStatus('Pago')" 
                        class="tab-button flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm transition-colors border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300"
                        data-status="Pago">
                    Pagos <span class="badge-count ml-2 bg-gray-100 text-gray-600" id="count-Pago">0</span>
                </button>
                <button onclick="filtrarPorStatus('Enviado')" 
                        class="tab-button flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm transition-colors border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300"
                        data-status="Enviado">
                    Enviados <span class="badge-count ml-2 bg-gray-100 text-gray-600" id="count-Enviado">0</span>
                </button>
                <button onclick="filtrarPorStatus('Entregue')" 
                        class="tab-button flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm transition-colors border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300"
                        data-status="Entregue">
                    Entregues <span class="badge-count ml-2 bg-gray-100 text-gray-600" id="count-Entregue">0</span>
                </button>
                <button onclick="filtrarPorStatus('Cancelado')" 
                        class="tab-button flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm transition-colors border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300"
                        data-status="Cancelado">
                    Cancelados <span class="badge-count ml-2 bg-gray-100 text-gray-600" id="count-Cancelado">0</span>
                </button>
            </nav>
        </div>

        <!-- Busca e Filtros -->
        <div class="p-4 border-b border-gray-200">
            <div class="flex gap-3">
                <div class="flex-1">
                    <input type="text" 
                           id="busca-pedido" 
                           placeholder="Buscar por nome, email, telefone ou ID do pedido..."
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           oninput="buscarPedido()">
                </div>
                <select id="ordenar" 
                        onchange="ordenarPedidos()"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="data-desc">Mais recentes</option>
                    <option value="data-asc">Mais antigos</option>
                    <option value="valor-desc">Maior valor</option>
                    <option value="valor-asc">Menor valor</option>
                </select>
            </div>
        </div>

    <!-- LISTA DE PEDIDOS -->
    <div id="lista-pedidos" class="space-y-4">
        <div class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
            <p class="text-gray-500 mt-4">Carregando pedidos...</p>
        </div>
    </div>
</div>

<!-- MODAL DETALHES DO PEDIDO -->

    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
        <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <h2 class="text-xl font-bold text-gray-900" id="modal-titulo">Pedido #0</h2>
            <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

        <div id="modal-conteudo" class="p-6"></div>
    </div>
</div>

<script src="painel-admin-script.js"></script>

<script>
// CONFIGURAÇÃO
const SUPABASE_URL = 'https://snupieyqdnltivjqctda.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jYZnNxQ1UsSF_yz2z3d3qA_ET1bqyJ0';
const LOJA_ID = 'e7e8b345-7c79-41cd-a454-befbad2580cc';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let todosPedidos = [];
let pedidosFiltrados = [];
let statusAtual = 'todos';

// ============================================
// VERIFICAR PERMISSÕES DE ADMIN
// ============================================
document.addEventListener('DOMContentLoaded', async () => {
    await verificarPermissoesAdmin();
});

async function verificarPermissoesAdmin() {
    try {
        // 1. Verifica se existe uma sessão ativa
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        if (!session) {
            console.log("Nenhuma sessão encontrada. Redirecionando...");
            window.location.href = 'index.html'; // Caminho da sua página de login/loja
            return;
        }

        const usuarioId = session.user.id;

        // 2. Busca o perfil do usuário para confirmar se é admin
        // Aqui usamos a tabela 'perfis' que é o padrão que você usa no index
        const { data: perfil, error: perfilError } = await supabaseClient
            .from('perfis')
            .select('is_admin')
            .eq('id', usuarioId)
            .single();

        // 3. Se houver erro ou não for admin, bloqueia o acesso
        if (perfilError || !perfil || !perfil.is_admin) {
            alert('🚫 Acesso negado! Este painel é restrito a administradores.');
            window.location.href = 'index.html';
            return;
        }

        // 4. Se chegou aqui, ele é ADMIN. Vamos carregar os dados da loja.
        const { data: loja, error: lojaError } = await supabaseClient
            .from('lojas')
            .select('nome_loja')
            .eq('id', LOJA_ID)
            .single();

        // É ADMIN! Liberar a tela e ocultar o loading
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('admin-content').classList.remove('hidden');
        
        if (loja) {
            document.getElementById('nome-loja').textContent = loja.nome_loja;
        }
        
        // Inicia o carregamento dos pedidos
        carregarDados();

    } catch (error) {
        console.error('Erro crítico na verificação:', error);
        window.location.href = 'index.html';
    }
}

// [RESTO DO CÓDIGO DO PAINEL - IGUAL AO PAINEL-ADMIN-MELHORADO.HTML]
// (Copiando as funções para não duplicar código)

async function carregarDados() {
    try {
        const { data: pedidos, error } = await supabaseClient
            .from('pedidos')
            .select(`
                *,
                itens_pedido (
                    id,
                    quantidade,
                    preco_unitario,
                    produto_id,
                    produtos (nome)
                )
            `)
            .eq('loja_id', LOJA_ID)
            .order('data', { ascending: false });

        if (error) throw error;

        todosPedidos = pedidos || [];
        atualizarEstatisticas();
        filtrarPorStatus('todos');
        
    } catch (error) {
        console.error('Erro ao carregar dados:', error);
        document.getElementById('lista-pedidos').innerHTML = `
            <div class="text-center py-12">
                <p class="text-red-600">❌ Erro ao carregar pedidos: ${error.message}</p>
                <button onclick="carregarDados()" 
                        class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    Tentar novamente
                </button>
            </div>
        `;
    }
}

function atualizarEstatisticas() {
    const stats = {
        total: todosPedidos.length,
        faturamento: todosPedidos
            .filter(p => p.status === 'Pago' || p.status === 'Enviado' || p.status === 'Entregue')
            .reduce((sum, p) => sum + parseFloat(p.total || 0), 0),
        pendentes: todosPedidos.filter(p => p.status === 'Pendente').length,
        enviar: todosPedidos.filter(p => p.status === 'Pago').length
    };

    document.getElementById('stat-total').textContent = stats.total;
    document.getElementById('stat-faturamento').textContent = formatarMoeda(stats.faturamento);
    document.getElementById('stat-pendentes').textContent = stats.pendentes;
    document.getElementById('stat-enviar').textContent = stats.enviar;

    document.getElementById('count-todos').textContent = stats.total;
    document.getElementById('count-Pendente').textContent = stats.pendentes;
    document.getElementById('count-Pago').textContent = stats.enviar;
    document.getElementById('count-Enviado').textContent = todosPedidos.filter(p => p.status === 'Enviado').length;
    document.getElementById('count-Entregue').textContent = todosPedidos.filter(p => p.status === 'Entregue').length;
    document.getElementById('count-Cancelado').textContent = todosPedidos.filter(p => p.status === 'Cancelado').length;
}

function filtrarPorStatus(status) {
    statusAtual = status;
    
    document.querySelectorAll('.tab-button').forEach(btn => {
        if (btn.dataset.status === status) {
            btn.className = 'tab-button flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm transition-colors border-blue-500 text-blue-600';
        } else {
            btn.className = 'tab-button flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm transition-colors border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300';
        }
    });

    if (status === 'todos') {
        pedidosFiltrados = [...todosPedidos];
    } else {
        pedidosFiltrados = todosPedidos.filter(p => p.status === status);
    }

    ordenarPedidos();
}

function ordenarPedidos() {
    const ordenacao = document.getElementById('ordenar').value;
    
    switch(ordenacao) {
        case 'data-desc':
            pedidosFiltrados.sort((a, b) => new Date(b.data) - new Date(a.data));
            break;
        case 'data-asc':
            pedidosFiltrados.sort((a, b) => new Date(a.data) - new Date(b.data));
            break;
        case 'valor-desc':
            pedidosFiltrados.sort((a, b) => parseFloat(b.total) - parseFloat(a.total));
            break;
        case 'valor-asc':
            pedidosFiltrados.sort((a, b) => parseFloat(a.total) - parseFloat(b.total));
            break;
    }
    
    renderizarPedidos();
}

function buscarPedido() {
    const termo = document.getElementById('busca-pedido').value.toLowerCase();
    
    if (!termo) {
        filtrarPorStatus(statusAtual);
        return;
    }

    pedidosFiltrados = todosPedidos.filter(p => {
        return (
            p.id.toString().includes(termo) ||
            (p.nome_cliente && p.nome_cliente.toLowerCase().includes(termo)) ||
            (p.email_cliente && p.email_cliente.toLowerCase().includes(termo)) ||
            (p.whatsapp && p.whatsapp.includes(termo))
        );
    });

    renderizarPedidos();
}

function renderizarPedidos() {
    const container = document.getElementById('lista-pedidos');
    
    if (pedidosFiltrados.length === 0) {
        container.innerHTML = `
            <div class="text-center py-12">
                <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                </svg>
                <p class="text-gray-500 text-lg">Nenhum pedido encontrado</p>
            </div>
        `;
        return;
    }

    container.innerHTML = pedidosFiltrados.map(pedido => `
        <div class="card-pedido bg-white rounded-xl shadow-sm p-6 hover:shadow-lg" onclick="abrirModal(${pedido.id})">
            <div class="flex items-start justify-between mb-4">
                <div class="flex-1">
                    <div class="flex items-center gap-3 mb-2">
                        <h3 class="text-lg font-bold text-gray-900">Pedido #${pedido.id}</h3>
                        <span class="status-badge status-${pedido.status.toLowerCase()}">
                            ${getIconeStatus(pedido.status)} ${pedido.status}
                        </span>
                    </div>
                    <p class="text-sm text-gray-600">📅 ${formatarData(pedido.data)}</p>
                </div>
                <div class="text-right">
                    <p class="text-2xl font-bold text-gray-900">${formatarMoeda(pedido.total)}</p>
                    <p class="text-xs text-gray-500">+ ${formatarMoeda(pedido.frete)} frete</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 border-t border-gray-100">
                <div>
                    <p class="text-xs text-gray-500 mb-1">👤 Cliente</p>
                    <p class="text-sm font-semibold text-gray-900">${pedido.nome_cliente || 'Não informado'}</p>
                    ${pedido.email_cliente ? `<p class="text-xs text-gray-600">📧 ${pedido.email_cliente}</p>` : ''}
                    ${pedido.whatsapp ? `<p class="text-xs text-gray-600">📱 ${formatarTelefone(pedido.whatsapp)}</p>` : ''}
                </div>

                <div>
                    <p class="text-xs text-gray-500 mb-1">📍 Endereço</p>
                    ${pedido.endereco_rua ? `
                        <p class="text-sm font-medium text-gray-900">${pedido.endereco_rua}, ${pedido.endereco_numero}</p>
                        <p class="text-xs text-gray-600">${pedido.endereco_bairro}, ${pedido.endereco_cidade}/${pedido.endereco_estado}</p>
                        <p class="text-xs text-gray-600">CEP: ${formatarCEP(pedido.endereco_cep)}</p>
                    ` : '<p class="text-xs text-gray-400">Endereço não informado</p>'}
                </div>

                <div>
                    <p class="text-xs text-gray-500 mb-1">📦 Envio</p>
                    ${pedido.tipo_frete ? `
                        <p class="text-sm font-medium text-gray-900">${pedido.tipo_frete}</p>
                        <p class="text-xs text-gray-600">${formatarMoeda(pedido.frete)}</p>
                    ` : '<p class="text-xs text-gray-400">Frete não calculado</p>'}
                </div>
            </div>

            ${pedido.itens_pedido && pedido.itens_pedido.length > 0 ? `
                <div class="mt-4 pt-4 border-t border-gray-100">
                    <p class="text-xs text-gray-500 mb-2">🛒 ${pedido.itens_pedido.length} item(ns)</p>
                    <div class="flex flex-wrap gap-2">

                </div>
            ` : ''}
        </div>
    `).join('');
}

async function atualizarStatus(pedidoId, novoStatus) {
    if (!novoStatus) return;

    try {
        const { error } = await supabaseClient
            .from('pedidos')
            .update({ status: novoStatus })
            .eq('id', pedidoId);

        if (error) throw error;

        alert(`✅ Status atualizado para: ${novoStatus}`);
        fecharModal();
        carregarDados();
    } catch (error) {
        alert(`❌ Erro ao atualizar status: ${error.message}`);
    }
}

function fecharModal() {
    document.getElementById('modal-pedido').classList.add('hidden');
}

function atualizarDados() {
    carregarDados();
}

function exportarRelatorio() {
    const csv = [
        ['ID', 'Data', 'Cliente', 'Email', 'WhatsApp', 'Status', 'Total', 'Frete', 'Tipo Frete', 'Endereço'].join(';'),
        ...pedidosFiltrados.map(p => [
            p.id,
            formatarDataCSV(p.data),
            p.nome_cliente || '',
            p.email_cliente || '',
            p.whatsapp || '',
            p.status,
            p.total,
            p.frete,
            p.tipo_frete || '',
            p.endereco_rua ? `${p.endereco_rua}, ${p.endereco_numero}, ${p.endereco_bairro}, ${p.endereco_cidade}/${p.endereco_estado}` : ''
        ].join(';'))
    ].join('\n');

    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `pedidos_${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
}

function formatarMoeda(valor) {
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor || 0);
}

function formatarData(data) {
    return new Date(data).toLocaleDateString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
}

function formatarDataCompleta(data) {
    return new Date(data).toLocaleDateString('pt-BR', {
        day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
}

function formatarDataCSV(data) {
    return new Date(data).toLocaleDateString('pt-BR');
}

function formatarTelefone(tel) {
    if (!tel) return '';
    const cleaned = tel.replace(/\D/g, '');
    if (cleaned.length === 11) {
        return `(${cleaned.substring(0,2)}) ${cleaned.substring(2,7)}-${cleaned.substring(7)}`;
    }
    return tel;
}

function formatarCEP(cep) {
    if (!cep) return '';
    const cleaned = cep.replace(/\D/g, '');
    if (cleaned.length === 8) {
        return `${cleaned.substring(0,5)}-${cleaned.substring(5)}`;
    }
    return cep;
}

function getIconeStatus(status) {
    const icones = {
        'Pendente': '⏳', 'Pago': '✅', 'Enviado': '📦', 
        'Entregue': '🎉', 'Cancelado': '❌', 'Reembolsado': '↩️'
    };
    return icones[status] || '📋';
}
